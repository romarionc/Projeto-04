<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONG - Comida para Todos</title>

  <link rel="icon" href="/assets/icons/logo_32x32.png" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/logo_180x180.png">
  
    <script type="module" crossorigin src="/js/script.js"></script>
    <link rel="stylesheet" crossorigin href="/css/styles.css">
  </head>

<body>
  <header>
    <h1>ONG - Comida para todos</h1>

    <div class="theme-switcher" role="radiogroup" aria-label="Seletor de tema">
      <button type="button" class="theme-btn" data-theme-btn="light" role="radio" aria-checked="false"
        aria-label="Ativar modo claro">
        Claro
      </button>
      <button type="button" class="theme-btn" data-theme-btn="dark" role="radio" aria-checked="false"
        aria-label="Ativar modo escuro">
        Escuro
      </button>
      <button type="button" class="theme-btn" data-theme-btn="high-contrast" role="radio" aria-checked="false"
        aria-label="Ativar modo alto contraste">
        Contraste
      </button>
    </div>

    <button class="nav-toggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="main-nav">
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>

    <nav id="main-nav" aria-hidden="true">
      <ul>
        <li><a href="#/" data-route="/">Página inicial</a></li>
        <li class="dropdown">
          <a href="#/projetos" data-route="/projetos" role="button" aria-haspopup="true" aria-expanded="false">
            Projetos sociais
          </a>
          <ul class="submenu">
            <li><a href="#/projeto-cozinha">Cozinha Comunitária</a></li>
            <li><a href="#/projeto-distribuicao">Distribuição Noturna</a></li>
            <li><a href="#/projeto-horta">Horta Urbana</a></li>
            <li><a href="#/projeto-eventos">Parcerias e Eventos</a></li>
          </ul>
        </li>
        <li><a href="#/cadastro" data-route="/cadastro">Cadastro</a></li>
      </ul>
    </nav>
  </header>

  <main id="spa-content">
    </main>

  <footer>
    <br>
    <p>&copy; 2025 ONG - Comida para todos</p>
    <br>
  </footer>

  <div id="toast-container" aria-live="polite"></div>
  <div id="feedback-modal" class="modal" hidden>
    <div class="modal-overlay"></div>
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <h3 id="modal-title" class="modal-title">Título do Modal</h3>
        <button id="modal-close-btn" class="modal-close-btn" aria-label="Fechar modal">&times;</button>
      </div>
      <div id="modal-body" class="modal-body">
        <p>Conteúdo do modal...</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-action="cancel">Cancelar</button>
        <button class="btn btn-primary" data-action="confirm">Confirmar</button>
      </div>
    </div>
  </div>

</body>

</html>
